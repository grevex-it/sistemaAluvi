name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Formato, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Tipos
        run: pnpm typecheck

      - name: Tests (incluye casos SoftTech de cortes)
        run: pnpm test

      - name: Build
        run: pnpm build
